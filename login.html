<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GiveEase</title>
    <link rel="stylesheet" href="login.css"> <!-- Linking login-specific CSS -->
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="GiveEase Logo">
            <span>GiveEase</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donations.html">Donations</a></li>
                <li><a href="institutions.html">Institutions</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login Form -->
    <section class="login-container">
        <h2>Login to Your Account</h2>
        <form action="#" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">

            <button type="submit" class="login-btn">Login</button>
        </form>
        <p class="register-link">Don't have an account? <a href="register.html">Sign Up</a></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 GiveEase. All Rights Reserved.</p>
    </footer>

</body>
</html>
